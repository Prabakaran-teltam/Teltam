{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    <link rel="shortcut icon" type="image/png" href="{% static 'images/favicon.png' %}">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - teltam.ai</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --brand-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --light-bg: #f8fafc;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        /* Decorative circles */
        .decor-circle-1 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.08) 0%, rgba(255, 255, 255, 0) 70%);
            top: -100px;
            left: -100px;
            z-index: -1;
        }

        .decor-circle-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.06) 0%, rgba(255, 255, 255, 0) 70%);
            bottom: -150px;
            right: -100px;
            z-index: -1;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            width: 100%;
            max-width: 460px;
            padding: 2.5rem;
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-2px);
        }

        .brand-logo-container {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: var(--brand-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            color: #ffffff;
            margin: 0 auto 1.5rem auto;
            box-shadow: 0 8px 16px rgba(79, 70, 229, 0.25);
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            color: #0f172a;
        }

        .form-label {
            font-weight: 500;
            font-size: 0.88rem;
            color: #334155;
        }

        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            outline: none;
        }

        .btn-brand-primary {
            background: var(--brand-gradient);
            color: #ffffff;
            border: none;
            font-weight: 600;
            padding: 0.8rem;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-brand-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 22px rgba(79, 70, 229, 0.3);
            color: #ffffff;
        }

        .btn-brand-primary:active {
            transform: translateY(0);
        }

        .text-gradient {
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

    <div class="decor-circle-1"></div>
    <div class="decor-circle-2"></div>

    <div class="login-card text-center">
        <div class="brand-logo-container">
            <i class="fas fa-brain"></i>
        </div>
        <h2 class="mb-1">Admin <span class="text-gradient">teltam.ai</span></h2>
        <p class="text-muted small mb-4">Please log in to your Teltam Staff account</p>

        <!-- Message Alerts -->
        {% include 'sweetalert_messages.html' %}


        <form method="POST" action="{% url 'dashboard_login' %}" class="text-start">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="far fa-user"></i></span>
                    <input type="text" name="username" id="username" class="form-control border-start-0 shadow-none" placeholder="e.g. admin@teltam.com" required>
                </div>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-lock"></i></span>
                    <input type="password" name="password" id="password" class="form-control border-start-0 shadow-none" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-brand-primary mb-3">Sign In to Dashboard</button>
            
            <div class="text-center">
                <a href="{% url 'home' %}" class="text-decoration-none small text-muted hover-primary"><i class="fas fa-arrow-left me-1"></i> Return to Public Site</a>
            </div>
        </form>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
